<!doctype html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <!-- Links of CSS files -->
        <link rel="stylesheet" href="assets/css/bootstrap.min.css">
        <link rel="stylesheet" href="assets/css/boxicons.min.css">
        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/header.css">
        <link rel="stylesheet" href="assets/css/responsive.css">

        <title>Starpath Academy - Loading</title>
        <link rel="icon" type="image/png" href="assets/img/all-img/favicon.png">

        <style>
            /* ── Full page loader container ── */
            .loader-page {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 999999;
                transition: opacity 0.5s ease, visibility 0.5s ease;
            }

            .loader-page.hidden {
                opacity: 0;
                visibility: hidden;
            }

            /* ── Same green dots as the template ── */
            .preloader-container {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                height: 80px;
                width: 80px;
                flex-wrap: wrap;
            }

            .preloader-dot {
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: #28a745; /* Green colour */
                animation: preloader-dot-anim 1.2s ease-in-out infinite;
            }

            .preloader-dot:nth-child(1) { animation-delay: 0.0s; }
            .preloader-dot:nth-child(2) { animation-delay: 0.1s; }
            .preloader-dot:nth-child(3) { animation-delay: 0.2s; }
            .preloader-dot:nth-child(4) { animation-delay: 0.3s; }
            .preloader-dot:nth-child(5) { animation-delay: 0.4s; }

            @keyframes preloader-dot-anim {
                0%, 100% {
                    transform: scale(0.6);
                    opacity: 0.4;
                }
                50% {
                    transform: scale(1.2);
                    opacity: 1;
                }
            }

            /* ── Optional Starpath branding ── */
            .loader-brand {
                position: absolute;
                bottom: 60px;
                text-align: center;
                width: 100%;
                font-family: 'Poppins', sans-serif;
            }

            .loader-brand h4 {
                color: #28a745;
                font-weight: 700;
                font-size: 18px;
                letter-spacing: 2px;
                margin: 0;
            }

            .loader-brand p {
                color: #888;
                font-size: 12px;
                margin: 4px 0 0;
                letter-spacing: 1px;
            }

            .loader-brand .loader-logo {
                max-width: 120px;
                margin-bottom: 10px;
            }
        </style>
    </head>
    <body>

        <!-- ═══ LOADER PAGE ═══ -->
        <div class="loader-page" id="loaderPage">
            <div class="preloader-container" id="preloader">
                <div class="preloader-dot"></div>
                <div class="preloader-dot"></div>
                <div class="preloader-dot"></div>
                <div class="preloader-dot"></div>
                <div class="preloader-dot"></div>
            </div>

            <!-- Optional Branding (you can remove or keep) -->
            <div class="loader-brand">
                <img class="loader-logo" src="assets/img/logo/logo.png" alt="Starpath Academy">
                <h4>STARPATH ACADEMY</h4>
                <p>Where Stars Are Made</p>
            </div>
        </div>

        <!-- ═══ LINKS ═══ -->
        <script>
            // ── Wait 3.5 seconds, then fade out loader and redirect ──
            window.addEventListener('load', function() {
                setTimeout(function() {
                    // Hide loader with fade effect
                    const loader = document.getElementById('loaderPage');
                    loader.classList.add('hidden');

                    // Redirect after fade completes (500ms)
                    setTimeout(function() {
                        window.location.href = '/Template_File/canyon/index.html';
                    }, 500);
                }, 3500); // 3.5 seconds display time
            });

            // ── Fallback: if for some reason the page takes too long ──
            // This ensures the loader doesn't stay forever
            setTimeout(function() {
                const loader = document.getElementById('loaderPage');
                if (!loader.classList.contains('hidden')) {
                    loader.classList.add('hidden');
                    setTimeout(function() {
                        window.location.href = '/Template_File/canyon/index.html';
                    }, 500);
                }
            }, 8000); // 8 seconds max wait
        </script>

    </body>
</html>
